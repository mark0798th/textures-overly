<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textures Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg-main: #0c0c0e;
    --bg-panel: #161618;
    --bg-input: #1f1f22;
    --border-color: #2a2a2d;
    --accent-color: #a68e74;
    --text-main: #e2e2e2;
    --text-dim: #88888b;
    --blood-red: #8a0303;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', 'Inter', sans-serif; }
*::before, *::after { box-sizing: border-box; }

body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; }

/* ── LAYOUT ─────────────────────────────────────────────── */
.app-wrapper {
    display: grid;
    grid-template-columns: 300px minmax(0,1fr) 420px;
    width: 100%;
    height: 100%;
}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.logo-area { display: flex; justify-content: space-between; align-items: flex-start; }
.logo-area-text h2 { font-size: 16px; color: var(--accent-color); letter-spacing: 1px; margin-bottom: 4px; }
.logo-area-text p  { font-size: 11px; color: var(--text-dim); }

/* Language toggle */
.lang-btn {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: .2s;
    white-space: nowrap;
    flex-shrink: 0;
}
.lang-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

.upload-box {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
    -webkit-tap-highlight-color: transparent;
}
.upload-box:hover { background: #252629; border-color: var(--accent-color); }
.upload-box i     { font-size: 18px; color: var(--accent-color); margin-bottom: 6px; }
.upload-box span  { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.upload-box small { font-size: 10px; color: var(--text-dim); }

.control-group { background: var(--bg-input); border-radius: 12px; padding: 13px; border: 1px solid var(--border-color); }
.group-title   { font-size: 11px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; text-transform: uppercase; }

.slider-item { margin-bottom: 10px; }
.slider-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }

input[type=range] { width: 100%; height: 3px; background: #333; outline: none; -webkit-appearance: none; accent-color: var(--accent-color); }

.btn-primary   { background: var(--accent-color); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; width: 100%; }
.btn-secondary { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 9px; border-radius: 8px; cursor: pointer; font-size: 12px; width: 100%; }

/* ── MAIN ────────────────────────────────────────────────── */
.main-content { padding: 20px; overflow-y: auto; min-width: 0; }

.preview-section { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; margin-bottom: 25px; }
.compare-box {
    background: #000;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    min-height: 260px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
}
.compare-box span { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.7); padding: 3px 8px; font-size: 10px; border-radius: 4px; z-index: 2; }
.compare-box img  { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }

.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.thumb-card     { background: var(--bg-panel); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
.thumb-card img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; image-rendering: pixelated; }
.thumb-info     { padding: 6px; font-size: 9px; text-align: center; color: var(--text-dim); }

/* ── 3D VIEWER ───────────────────────────────────────────── */
.viewer-panel {
    background: var(--bg-panel);
    border-left: 1px solid var(--border-color);
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
}
.viewer-header { padding: 16px 18px 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
.viewer-header h3 { font-size: 13px; color: var(--accent-color); letter-spacing: .5px; }
.viewer-header .badge { font-size: 9px; background: rgba(166,142,116,.15); color: var(--accent-color); padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(166,142,116,.3); }

.viewer-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
#threeCanvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#threeCanvas:active { cursor: grabbing; }

/* Real-time indicator */
.rt-badge {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,.7);
    border: 1px solid rgba(76,175,80,.4);
    color: #4CAF50;
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s;
}
.rt-badge.show { opacity: 1; }

.viewer-label {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: var(--accent-color); font-size: 10px;
    padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(166,142,116,.3);
    pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap;
}
.viewer-label.show { opacity: 1; }

.viewer-footer { padding: 12px 18px; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
.skin-counter  { flex: 1; font-size: 11px; color: var(--text-dim); }
.skin-counter strong { color: var(--text-main); }

.btn-viewer {
    background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-dim);
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center; transition: .2s;
}
.btn-viewer:hover { color: var(--text-main); border-color: var(--accent-color); }

/* Timer ring */
.timer-ring svg .bg-ring { fill: none; stroke: #2a2a2d; stroke-width: 2.5; }
.timer-ring svg .fg-ring { fill: none; stroke: var(--accent-color); stroke-width: 2.5; stroke-dasharray: 75.4; stroke-dashoffset: 75.4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .1s linear; }

.status-bar { position: fixed; bottom: 0; right: 420px; left: 300px; background: #1a1b1e; padding: 9px 20px; font-size: 11px; border-top: 1px solid var(--border-color); color: #4CAF50; z-index: 10; }

#clothingFiles, #bloodFiles { display: none; }

/* ── MOBILE ──────────────────────────────────────────────── */
@media (max-width: 1100px) {
    body { overflow: auto; height: auto; }
    .app-wrapper { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border-color); padding: 14px; }
    .main-content { order: 2; padding: 14px; }
    .viewer-panel { order: 1; border-left: none; border-bottom: 1px solid var(--border-color); height: 70vh; min-height: 500px; }
    .viewer-wrap, #threeCanvas { min-height: 420px; }
    .preview-section { grid-template-columns: 1fr; }
    .grid-container { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
    .status-bar { position: relative; left: auto; right: auto; bottom: auto; }
}
@media (max-width: 700px) {
    .viewer-panel { height: 78vh; min-height: 580px; }
    .viewer-wrap, #threeCanvas { min-height: 520px; }
    .viewer-header, .viewer-footer { padding: 14px; }
    .sidebar { gap: 10px; }
    .compare-box { min-height: 180px; }
    .btn-primary, .btn-secondary { min-height: 42px; }
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
</style>
</head>
<body>

<div class="app-wrapper">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-area-text">
        <h2>TEXTURES CONVERTER</h2>
        <p data-i18n="subtitle">Batch Clothing &amp; Blood Overlay</p>
      </div>
      <button class="lang-btn" id="langBtn">TH</button>
    </div>

    <div class="upload-box" onclick="document.getElementById('clothingFiles').click()">
      <i class="fa-solid fa-shirt"></i>
      <span data-i18n="clothingLabel">Clothing (ZIP/PNG)</span>
      <small id="clothingLabel" data-i18n-default="No file selected">No file selected</small>
      <input type="file" id="clothingFiles" multiple accept="image/*,.zip">
    </div>

    <div class="upload-box" onclick="document.getElementById('bloodFiles').click()">
      <i class="fa-solid fa-droplet" style="color: var(--blood-red);"></i>
      <span data-i18n="bloodLabel">Blood Mask (ZIP/PNG)</span>
      <small id="bloodLabel" data-i18n-default="No file selected">No file selected</small>
      <input type="file" id="bloodFiles" multiple accept="image/png,.zip">
    </div>

    <div class="control-group">
      <div class="group-title" data-i18n="colorAdj">Color Adjustment</div>
      <div class="slider-item">
        <div class="slider-header"><label data-i18n="hue">Hue</label> <span id="hueVal">0</span></div>
        <input type="range" id="hue" min="-180" max="180" value="0">
      </div>
      <div class="slider-item">
        <div class="slider-header"><label data-i18n="sat">Saturation</label> <span id="satVal">0</span>%</div>
        <input type="range" id="saturation" min="-100" max="100" value="0">
      </div>
      <div class="slider-item">
        <div class="slider-header"><label data-i18n="bright">Brightness</label> <span id="brightVal">0</span>%</div>
        <input type="range" id="brightness" min="-100" max="100" value="0">
      </div>
      <div class="slider-item">
        <div class="slider-header"><label data-i18n="contrast">Contrast</label> <span id="contrastVal">0</span>%</div>
        <input type="range" id="contrast" min="-100" max="100" value="0">
      </div>
    </div>

    <button class="btn-primary" id="processBtn">
      <i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="processBtn">Process Batch</span>
    </button>
    <button class="btn-secondary" id="downloadBtn" style="margin-top:2px;">
      <i class="fa-solid fa-download"></i> <span data-i18n="downloadBtn">Download All (ZIP)</span>
    </button>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="main-content">
    <div class="preview-section">
      <div class="compare-box">
        <span data-i18n="original">Original</span>
        <img id="beforeImg" src="">
      </div>
      <div class="compare-box">
        <span data-i18n="preview">Preview</span>
        <img id="afterImg" src="">
      </div>
    </div>
    <h4 style="margin-bottom:12px; font-size:13px; color: var(--text-dim);" data-i18n="allImages">All Images</h4>
    <div id="finalPreview" class="grid-container"></div>
  </main>

  <!-- ── 3D Viewer ─────────────────────────────────────────── -->
  <aside class="viewer-panel">
    <div class="viewer-header">
      <h3><i class="fa-solid fa-cube" style="margin-right:6px; font-size:11px;"></i> 3D PREVIEW</h3>
      <span class="badge" id="autoLabel">AUTO 5s</span>
    </div>
    <div class="viewer-wrap">
      <canvas id="threeCanvas"></canvas>
      <div class="viewer-label" id="skinLabel"></div>
      <div class="rt-badge" id="rtBadge">● LIVE</div>
    </div>
    <div class="viewer-footer">
      <div class="skin-counter">
        <span data-i18n="skinWord">Skin</span> <strong id="currentSkinNum">-</strong> / <strong id="totalSkinNum">0</strong>
      </div>
      <button class="btn-viewer" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="timer-ring">
        <svg width="30" height="30" viewBox="0 0 30 30">
          <circle class="bg-ring" cx="15" cy="15" r="12"/>
          <circle class="fg-ring" id="timerCircle" cx="15" cy="15" r="12"/>
        </svg>
      </div>
      <button class="btn-viewer" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="btn-viewer" id="pauseBtn"><i class="fa-solid fa-pause" id="pauseIcon"></i></button>
    </div>
  </aside>
</div>

<div class="status-bar" id="statusBar">
  <i class="fa-solid fa-circle-check"></i> <span id="statusText" data-i18n="ready">Ready</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  const val = LANG[currentLang][key];
  return typeof val === 'function' ? val(...args) : (val ?? key);
}

function applyLang() {
  const L = LANG[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (L[key] !== undefined && typeof L[key] === 'string') el.textContent = L[key];
  });
  // Dynamic labels
  document.getElementById('clothingLabel').textContent =
    originalFiles.length ? t('loadedFiles', originalFiles.length) : L.noFile;
  document.getElementById('bloodLabel').textContent =
    bloodImagesList.length ? t('loadedMasks', bloodImagesList.length) : L.noFile;
  document.getElementById('statusText').textContent = L.ready;
  document.getElementById('autoLabel').textContent = isPaused ? L.paused : L.autoLabel;
  document.getElementById('langBtn').textContent = currentLang === 'en' ? 'TH' : 'EN';
}

document.getElementById('langBtn').onclick = () => {
  currentLang = currentLang === 'en' ? 'th' : 'en';
  applyLang();
};

// =============================================
// IMAGE PROCESSING
// =============================================
const sliders = ['hue','saturation','brightness','contrast'];
const elements = {};
let originalFiles    = [];
let bloodImagesList  = [];
let processedBlobs   = [];

// Debounce helper
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

sliders.forEach(id => {
  const input    = document.getElementById(id);
  const labelMap = { brightness:'brightVal', saturation:'satVal' };
  const labelId  = labelMap[id] || id + 'Val';
  const label    = document.getElementById(labelId);
  elements[id]   = input;
  input.oninput  = () => {
    label.textContent = input.value;
    debouncedUpdate();           // update comparison preview
    debouncedUpdate3D();         // update 3D viewer in real-time
  };
});

const debouncedUpdate   = debounce(updateComparison, 80);
const debouncedUpdate3D = debounce(update3DPreview,  80);

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.src = src;
  });
}

// ── Clothing upload ──────────────────────────────────────────
document.getElementById('clothingFiles').onchange = async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  originalFiles = [];
  document.getElementById('statusText').textContent = t('loading');
  for (const file of files) {
    if (file.name.endsWith('.zip')) {
      const zip = await JSZip.loadAsync(file);
      for (let name in zip.files) {
        if (name.match(/\.(png|jpg|jpeg|webp)$/i)) {
          const blob = await zip.files[name].async('blob');
          originalFiles.push({ blob, name });
        }
      }
    } else {
      originalFiles.push({ blob: file, name: file.name });
    }
  }
  document.getElementById('clothingLabel').textContent = t('loadedFiles', originalFiles.length);
  document.getElementById('statusText').textContent = t('ready');

  if (originalFiles.length > 0) {
    document.getElementById('beforeImg').src = URL.createObjectURL(originalFiles[0].blob);
    await updateComparison();
    // ✅ Real-time: immediately update 3D viewer with first uploaded skin (processed)
    await update3DPreview();
  }
  updateViewerCount();
};

// ── Blood upload ─────────────────────────────────────────────
document.getElementById('bloodFiles').onchange = async (e) => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  bloodImagesList = [];
  document.getElementById('statusText').textContent = t('loadBlood');
  for (const file of files) {
    if (file.name.endsWith('.zip')) {
      const zip = await JSZip.loadAsync(file);
      for (let name in zip.files) {
        if (name.match(/\.(png)$/i)) {
          const blob = await zip.files[name].async('blob');
          const url = URL.createObjectURL(blob);
          bloodImagesList.push(await loadImage(url));
        }
      }
    } else {
      const url = URL.createObjectURL(file);
      bloodImagesList.push(await loadImage(url));
    }
  }
  document.getElementById('bloodLabel').textContent = t('loadedMasks', bloodImagesList.length);
  document.getElementById('statusText').textContent = t('bloodReady');
  await updateComparison();
  // ✅ Real-time: re-process current 3D skin with new blood mask
  await update3DPreview();
};

async function updateComparison() {
  if (!originalFiles.length) return;
  const blob = await processImage(originalFiles[0].blob);
  document.getElementById('afterImg').src = URL.createObjectURL(blob);
}

async function processImage(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const ctx    = canvas.getContext('2d');
      canvas.width  = img.width;
      canvas.height = img.height;
      ctx.imageSmoothingEnabled = false;
      ctx.filter = `hue-rotate(${elements.hue.value}deg) `
                 + `saturate(${100 + Number(elements.saturation.value)}%) `
                 + `brightness(${100 + Number(elements.brightness.value)}%) `
                 + `contrast(${100 + Number(elements.contrast.value)}%)`;
      ctx.drawImage(img, 0, 0);
      if (bloodImagesList.length > 0) {
        const randomBlood = bloodImagesList[Math.floor(Math.random() * bloodImagesList.length)];
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'source-atop';
        ctx.drawImage(randomBlood, 0, 0, canvas.width, canvas.height);
      }
      canvas.toBlob(res, 'image/png');
    };
    img.src = URL.createObjectURL(blob);
  });
}

// ✅ Real-time 3D update: re-process the currently displayed skin and push to viewer
async function update3DPreview() {
  if (!originalFiles.length) return;
  const idx  = currentSkinIdx < originalFiles.length ? currentSkinIdx : 0;
  const blob = await processImage(originalFiles[idx].blob);
  const url  = URL.createObjectURL(blob);
  flashRTBadge();
  await loadTextureIntoViewer(url);
}

function flashRTBadge() {
  const badge = document.getElementById('rtBadge');
  badge.classList.add('show');
  clearTimeout(badge._t);
  badge._t = setTimeout(() => badge.classList.remove('show'), 1200);
}

// ── Batch process ──────────────────────────────────────────────
document.getElementById('processBtn').onclick = async () => {
  if (!originalFiles.length) return;
  const grid = document.getElementById('finalPreview');
  grid.innerHTML = '';
  processedBlobs = [];
  document.getElementById('statusText').textContent = t('processing');
  for (let item of originalFiles) {
    const blob = await processImage(item.blob);
    processedBlobs.push({ blob, name: item.name });
    const div = document.createElement('div');
    div.className = 'thumb-card';
    div.innerHTML = `<img src="${URL.createObjectURL(blob)}"><div class="thumb-info">${item.name}</div>`;
    grid.appendChild(div);
  }
  document.getElementById('statusText').textContent = t('done');
  // Feed processed images into 3D viewer
  loadViewerSkins(processedBlobs);
};

document.getElementById('downloadBtn').onclick = async () => {
  if (!processedBlobs.length) return;
  const zip = new JSZip();
  processedBlobs.forEach(item => zip.file(item.name, item.blob));
  const content = await zip.generateAsync({ type: "blob" });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(content);
  link.download = "processed_textures.zip";
  link.click();
};

const canvas3d = document.getElementById('threeCanvas');

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

let isDragging = false, prevMouse = { x: 0, y: 0 };
let rotY = 0, rotX = 0.1;
const modelGroup = new THREE.Group();

canvas3d.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', () => isDragging = false);
canvas3d.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY += (e.clientX - prevMouse.x) * 0.01;
  rotX += (e.clientY - prevMouse.y) * 0.005;
  rotX  = Math.max(-0.4, Math.min(0.4, rotX));
  prevMouse = { x: e.clientX, y: e.clientY };
});
canvas3d.addEventListener('touchstart', e => { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
canvas3d.addEventListener('touchend', () => isDragging = false);
canvas3d.addEventListener('touchmove', e => {
  if (!isDragging) return;
  rotY += (e.touches[0].clientX - prevMouse.x) * 0.01;
  prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  e.preventDefault();
}, { passive: false });

// ─── UV helpers ─────────────────────────────────────────────
function makeBoxUV(u, v, w, h, d, tw, th, mirror = false) {
  const s = 1 / tw, t_ = 1 / th;
  function face(px, py, pw, ph, flipU = false) {
    let u0 = px * s, u1 = (px + pw) * s;
    if (flipU) [u0, u1] = [u1, u0];
    const vTop = 1 - py * t_, vBot = 1 - (py + ph) * t_;
    return [u0,vTop, u1,vTop, u0,vBot, u1,vBot];
  }
  if (!mirror) {
    return [
      face(u + d + w,   v + d, d, h),
      face(u,           v + d, d, h),
      face(u + d,       v,     w, d),
      face(u + d + w,   v,     w, d),
      face(u + d,       v + d, w, h),
      face(u+d+d+w,     v + d, w, h),
    ];
  } else {
    return [
      face(u,           v + d, d, h, true),
      face(u + d + w,   v + d, d, h, true),
      face(u + d,       v,     w, d, true),
      face(u + d + w,   v,     w, d, true),
      face(u + d,       v + d, w, h, true),
      face(u+d+d+w,     v + d, w, h, true),
    ];
  }
}
function applyBoxUV(geo, uvFaces) {
  const arr = geo.attributes.uv.array;
  for (let f = 0; f < 6; f++) {
    const face = uvFaces[f], base = f * 4 * 2;
    for (let i = 0; i < 8; i++) arr[base + i] = face[i];
  }
  geo.attributes.uv.needsUpdate = true;
}

// ─── Build model ─────────────────────────────────────────────
function buildModel(texture) {
  while (modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
  const TW = 64, TH = 64;
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  const mat = new THREE.MeshLambertMaterial({ map: texture, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide });
  const S = 1 / 16;
  function makePart(ox, oy, oz, sw, sh, sd, u, v, inflate = 0, mirror = false) {
    const uFaces = makeBoxUV(u, v, sw, sh, sd, TW, TH, mirror);
    const geo    = new THREE.BoxGeometry((sw+inflate*2)*S, (sh+inflate*2)*S, (sd+inflate*2)*S, 1, 1, 1);
    applyBoxUV(geo, uFaces);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((ox+sw/2)*S, (oy+sh/2)*S, (oz+sd/2)*S);
    return mesh;
  }
  const rootGroup = new THREE.Group();
  rootGroup.add(makePart(-4, 12, -2, 8, 12, 4, 16, 16));
  rootGroup.add(makePart(-4, 12, -2, 8, 12, 4, 16, 32, 0.25));
  const headGroup = new THREE.Group();
  headGroup.position.set(0, 24*S, 0);
  headGroup.add(makePart(-4, 0, -4, 8, 8, 8,  0,  0));
  headGroup.add(makePart(-4, 0, -4, 8, 8, 8, 32,  0, 0.5));
  headGroup.add(makePart(-4, 0, -4, 8, 8, 8,  0, 48, 0.9));
  rootGroup.add(headGroup);
  const rightArmGroup = new THREE.Group();
  rightArmGroup.position.set(-5*S, 22*S, 0);
  rightArmGroup.add(makePart(-3, -10, -2, 4, 12, 4, 40, 16));
  rightArmGroup.add(makePart(-3, -10, -2, 4, 12, 4, 40, 32, 0.25));
  rootGroup.add(rightArmGroup);
  const leftArmGroup = new THREE.Group();
  leftArmGroup.position.set(5*S, 22*S, 0);
  leftArmGroup.add(makePart(-1, -10, -2, 4, 12, 4, 40, 16, 0,    true));
  leftArmGroup.add(makePart(-1, -10, -2, 4, 12, 4, 40, 32, 0.25, true));
  rootGroup.add(leftArmGroup);
  const rightLegGroup = new THREE.Group();
  rightLegGroup.position.set(-1.9*S, 12*S, 0);
  rightLegGroup.add(makePart(-2, -12, -2, 4, 12, 4,  0, 16));
  rightLegGroup.add(makePart(-2, -12, -2, 4, 12, 4,  0, 32, 0.25));
  rootGroup.add(rightLegGroup);
  const leftLegGroup = new THREE.Group();
  leftLegGroup.position.set(1.9*S, 12*S, 0);
  leftLegGroup.add(makePart(-2, -12, -2, 4, 12, 4,  0, 16, 0,    true));
  leftLegGroup.add(makePart(-2, -12, -2, 4, 12, 4,  0, 32, 0.25, true));
  rootGroup.add(leftLegGroup);
  modelGroup.add(rootGroup);
  modelGroup.userData = { rootGroup, headGroup, leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup };
}

// ✅ Load texture URL into viewer without changing skin index
function loadTextureIntoViewer(url) {
  return new Promise(resolve => {
    new THREE.TextureLoader().load(url, tex => {
      buildModel(tex);
      resolve();
    });
  });
}

function resizeRenderer() {
  const panel = canvas3d.parentElement;
  const w = panel.clientWidth, h = panel.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

let animT = 0;
function animate() {
  requestAnimationFrame(animate);
  animT += 0.03;
  modelGroup.rotation.y = rotY;
  modelGroup.rotation.x = rotX;
  if (modelGroup.userData.leftArmGroup) {
    const swing = Math.sin(animT) * 0.2;
    modelGroup.userData.leftArmGroup.rotation.x  =  swing;
    modelGroup.userData.rightArmGroup.rotation.x = -swing;
    modelGroup.userData.leftLegGroup.rotation.x  = -swing;
    modelGroup.userData.rightLegGroup.rotation.x =  swing;
    modelGroup.userData.headGroup.rotation.y = Math.sin(animT * 0.5) * 0.08;
  }
  if (!isDragging) rotY += 0.005;
  renderer.render(scene, camera);
}
animate();

// =============================================
// SKIN SWITCHER
// =============================================
let viewerSkins    = [];
let currentSkinIdx = 0;
let autoTimer      = null;
let timerProgress  = 0;
let isPaused       = false;
const INTERVAL     = 5000;
const timerCircle  = document.getElementById('timerCircle');
const circumference = 75.4;

async function loadBaseSkin() {
  const tex = await new Promise(r => new THREE.TextureLoader().load('data:image/png;base64,' + BASE_SKIN_B64, r));
  buildModel(tex);
}
loadBaseSkin();

function updateViewerCount() {
  const list = viewerSkins.length > 0 ? viewerSkins : originalFiles;
  document.getElementById('totalSkinNum').textContent   = list.length || 0;
  document.getElementById('currentSkinNum').textContent = list.length > 0 ? (currentSkinIdx + 1) : '-';
}

async function showSkin(idx, skins) {
  if (!skins || skins.length === 0) return;
  currentSkinIdx = (idx + skins.length) % skins.length;
  const skin = skins[currentSkinIdx];

  // ✅ Always re-process when switching, so sliders + blood apply
  let url;
  if (skin.blob && originalFiles.length > 0 && viewerSkins.length === 0) {
    // raw original — process on the fly
    const blob = await processImage(skin.blob);
    url = URL.createObjectURL(blob);
  } else if (skin.blob) {
    url = URL.createObjectURL(skin.blob);
  } else {
    url = skin.url;
  }

  const label = document.getElementById('skinLabel');
  label.textContent = skin.name || `Skin ${currentSkinIdx + 1}`;
  label.classList.add('show');
  setTimeout(() => label.classList.remove('show'), 2000);

  await loadTextureIntoViewer(url);
  updateViewerCount();
}

function loadViewerSkins(blobs) {
  viewerSkins    = blobs.map(b => ({ blob: b.blob, name: b.name }));
  currentSkinIdx = 0;
  updateViewerCount();
  startAutoTimer();
  showSkin(0, viewerSkins);
}

function startAutoTimer() {
  clearInterval(autoTimer);
  timerProgress = 0;
  const step = 100;
  autoTimer = setInterval(() => {
    if (isPaused) return;
    timerProgress += step;
    const pct = timerProgress / INTERVAL;
    timerCircle.style.strokeDashoffset = circumference * (1 - pct);
    if (timerProgress >= INTERVAL) {
      timerProgress = 0;
      const skins = viewerSkins.length > 0 ? viewerSkins : originalFiles;
      if (skins.length > 0) showSkin(currentSkinIdx + 1, skins);
    }
  }, step);
}

document.getElementById('prevBtn').onclick = () => {
  timerProgress = 0;
  const skins = viewerSkins.length > 0 ? viewerSkins : originalFiles;
  if (skins.length > 0) showSkin(currentSkinIdx - 1, skins);
};
document.getElementById('nextBtn').onclick = () => {
  timerProgress = 0;
  const skins = viewerSkins.length > 0 ? viewerSkins : originalFiles;
  if (skins.length > 0) showSkin(currentSkinIdx + 1, skins);
};
document.getElementById('pauseBtn').onclick = () => {
  isPaused = !isPaused;
  document.getElementById('pauseIcon').className = isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
  document.getElementById('autoLabel').textContent = isPaused ? t('paused') : t('autoLabel');
};

// ✅ When clothing uploaded, immediately show first skin processed in 3D
document.getElementById('clothingFiles').addEventListener('change', () => {
  setTimeout(() => {
    if (originalFiles.length > 0) {
      const skins = originalFiles.map(f => ({ blob: f.blob, name: f.name }));
      // Don't overwrite processedBlobs viewerSkins — feed raw skins as live preview
      if (viewerSkins.length === 0) {
        viewerSkins = [];  // clear so showSkin uses originalFiles path
      }
      updateViewerCount();
      if (!autoTimer) startAutoTimer();
    }
  }, 600);
});

// Grid + fog
const gridHelper = new THREE.GridHelper(4, 8, 0x2a2a2d, 0x1e1e20);
gridHelper.position.y = -0.75;
scene.add(gridHelper);
scene.fog = new THREE.Fog(0x0e0e10, 6, 15);

// Init language
applyLang();
</script>
</body>
